# Organizer — test → derleme (Windows: PyInstaller klasörü + fcpack zip + NSIS kurulum; Ubuntu: imzalı APK) → GitHub Release
# (ortak çekirdek reusable-release.yml: latest.json + son 5 sürümden FCD1 yamaları).
# Yayın: sürümü değiştir (masaustu/organizer/__init__.py + telefon/app.js + release-notes.json), main'e birleştir, sonra
#   Actions → release → "Run workflow" (main)   ya da   git tag vX.Y.Z && git push origin vX.Y.Z
# Entegrasyon dallarında (ortak-cekirdek-*) yalnız test + derleme çalışır.
# Android APK yalnız ANDROID_KEYSTORE_B64 + ANDROID_KEYSTORE_PASS secret'ları varsa derlenir (ANDROID_KEY_PASS yoksa = KEYSTORE_PASS,
# ANDROID_KEY_ALIAS yoksa keystore'daki ilk anahtar keytool ile bulunur). Bütün APK'lar AYNI anahtarla imzalanmalı.
# Eski kurulumlar (2.1.0.x, RSA imzalı guncelleme/*.json) için köprü: release'ten SONRA geliştiricinin bilgisayarında
#   python araclar/kopru.py --gonder      (RSA anahtarı yalnız orada)
name: release
on:
  push:
    tags: ['v*']
    branches: ['ortak-cekirdek-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }     # köprü aracı 2.1.0.13 kodunu git geçmişinden alır
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Qt (offscreen) için sistem kitaplıkları
        run: (sudo apt-get update -q || true) && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 >/dev/null
      - run: pip install -q "PySide6>=6.8,<7" pytest cryptography
      - name: Masaüstü (pytest, offscreen Qt)
        run: cd masaustu && QT_QPA_PLATFORM=offscreen python -m pytest -q tests
      - name: Telefon (Playwright, tarayıcıda)
        run: |
          npm i --no-save --no-package-lock playwright-core@1 playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          PLAYWRIGHT_CORE="$PWD/node_modules/playwright-core" node araclar/test-telefon.js
      - name: Köprü aracı (imzasız kuru çalıştırma)
        run: python araclar/kopru.py --kuru
      - name: Etiket = sürüm
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(grep -o '__version__ = "[0-9.]*"' masaustu/organizer/__init__.py | grep -o '[0-9][0-9.]*')"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "::error::etiket ${GITHUB_REF_NAME} ≠ v$v"; exit 1; }

  build-win:
    needs: test
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8     # fcpack Türkçe çıktı yazar; Windows konsolu cp1252
      PYTHONUTF8: '1'
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: ver
        shell: bash
        run: echo "version=$(grep -o '__version__ = "[0-9.]*"' masaustu/organizer/__init__.py | grep -o '[0-9][0-9.]*')" >> "$GITHUB_OUTPUT"
      - run: pip install -q "PySide6>=6.8,<7" pyinstaller cryptography
      - name: PyInstaller (one-dir)
        shell: bash
        run: cd masaustu && pyinstaller --noconfirm --clean organizer.spec && ls dist/Organizer
      - name: win-app (fcpack zip) + NSIS kurulum
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force release | Out-Null
          Push-Location masaustu
          python -m fccore.fcpack dist\Organizer ..\release\Organizer-win-app.zip
          if ($LASTEXITCODE -ne 0) { throw 'fcpack başarısız' }
          Pop-Location
          $mk = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $mk) { $mk = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          if (-not (Test-Path $mk)) {
            # 2026-11: windows-latest imajında NSIS hazır gelmeyebiliyor → choco; o da olmazsa taşınabilir NSIS zip
            choco install nsis -y --no-progress
            $c = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe")
            if ($env:ChocolateyInstall) { $c += (Get-ChildItem "$env:ChocolateyInstall\lib" -Recurse -Filter makensis.exe -ErrorAction SilentlyContinue | ForEach-Object FullName) }
            $mk = $c | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
            if (-not $mk) {
              Invoke-WebRequest -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.10/nsis-3.10.zip" -OutFile nsis.zip -UserAgent "Wget"
              Expand-Archive nsis.zip -DestinationPath "$env:RUNNER_TEMP\nsis" -Force
              $mk = (Get-ChildItem "$env:RUNNER_TEMP\nsis" -Recurse -Filter makensis.exe | Select-Object -First 1).FullName
            }
            Write-Host "makensis: $mk"
          }
          & $mk -V2 "-DVERSION=$v" "-DSRC=$PWD\masaustu\dist\Organizer" "-DOUT=$PWD\release\Organizer-Setup-$v.exe" "-DICON=$PWD\masaustu\assets\logo.ico" kurulum\organizer.nsi
          if ($LASTEXITCODE -ne 0) { throw 'makensis başarısız' }
          Get-ChildItem release | Format-Table Name, Length
          Get-FileHash release\* -Algorithm SHA256 | Format-Table Hash, Path
      - name: Kurulu programın açılış denetimi (dist klasöründen, 15 sn)
        shell: pwsh
        run: |
          $env:ORGANIZER_DATA = "$env:RUNNER_TEMP\organizer-veri"
          New-Item -ItemType Directory -Force $env:ORGANIZER_DATA | Out-Null
          $p = Start-Process masaustu\dist\Organizer\Organizer.exe -PassThru
          Start-Sleep 15
          if ($p.HasExited) { Get-Content "$env:ORGANIZER_DATA\hata-kaydi.txt" -ErrorAction SilentlyContinue; Get-Content "$env:ORGANIZER_DATA\fccore\cokme-yerel.log" -ErrorAction SilentlyContinue; throw "program açılmadı (çıkış $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          if (-not (Test-Path "$env:ORGANIZER_DATA\organizer.db")) { throw 'veritabanı oluşmadı' }
      - uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: release/
          retention-days: 5

  build-android:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.apk.outputs.apk }}
      files: ${{ steps.files.outputs.files }}
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && secrets.ANDROID_KEYSTORE_PASS != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true'
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK (platform 35, build-tools 35)
        if: env.HAS_KEY == 'true'
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || yes | "$SM" "platforms;android-35" >/dev/null
          [ -d "$ANDROID_HOME/build-tools/35.0.0" ] || yes | "$SM" "build-tools;35.0.0" >/dev/null
      - name: İmzalı APK
        id: apk
        if: env.HAS_KEY == 'true'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/organizer.keystore"
          export ANDROID_KEYSTORE="$RUNNER_TEMP/organizer.keystore"
          [ -n "${ANDROID_KEY_PASS:-}" ] || unset ANDROID_KEY_PASS
          [ -n "${ANDROID_KEY_ALIAS:-}" ] || unset ANDROID_KEY_ALIAS
          bash android/build.sh "$RUNNER_TEMP/apk"
          rm -f "$ANDROID_KEYSTORE"
          mkdir release && cp "$RUNNER_TEMP"/apk/Organizer-*.apk release/ && rm -f release/*imzasiz*
          ls -la release && sha256sum release/*
          echo "apk=true" >> "$GITHUB_OUTPUT"
      - name: Anahtar yok → Android atlandı
        if: env.HAS_KEY != 'true'
        run: echo "::warning::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS secret'ları yok — APK derlenmedi, android kanalı bu sürümde yok."
      - uses: actions/upload-artifact@v4
        if: steps.apk.outputs.apk == 'true'
        with:
          name: release-android
          path: release/
          retention-days: 5
      - name: Yayınlanacak kanallar
        id: files
        run: |
          {
            echo 'files<<KANALLAR'
            echo 'win-app=Organizer-win-app.zip'
            echo 'win-setup=Organizer-Setup-*.exe'
            if [ "${{ steps.apk.outputs.apk }}" = "true" ]; then echo 'android=Organizer-*.apk'; fi
            echo 'KANALLAR'
          } >> "$GITHUB_OUTPUT"

  release:
    needs: [test, build-win, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
    uses: departures-mil/ortak-cekirdek/.github/workflows/reusable-release.yml@main
    with:
      app_id: organizer
      version: ${{ needs.build-win.outputs.version }}
      file_prefix: Organizer
      release_title: Organizer v${{ needs.build-win.outputs.version }}
      min_version: 2.2.2
      files: ${{ needs.build-android.outputs.files }}
      notes_json: release-notes.json
      core_ref: main
