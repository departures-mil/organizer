<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5f74">
<title>Organizer</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
  <div class="toprow">
    <img src="img/logo.png" alt="" class="logo">
    <div class="titles"><div id="appTitle"></div><div id="appSub"></div></div>
    <div class="tbtns">
      <button id="updBtn" class="iconbtn" aria-label="update"><span id="updIcon"></span><i id="updDot"></i></button>
      <button id="syncBtn" class="iconbtn" aria-label="sync"><span id="syncIcon"></span><i id="syncDot"></i></button>
      <button id="eyeBtn" class="iconbtn" aria-label="hide"></button>
      <button id="scanBtn" class="iconbtn" aria-label="search"></button>
    </div>
  </div>
  <div class="toprow langrow"><div id="langSeg" class="tbseg"></div></div>
  <div id="updProg" hidden><div class="upt"><span id="updTxt"></span></div><div class="upbar"><i id="updFill"></i></div></div>
</header>
<main id="page"></main>
<nav id="tabs"></nav>
<div id="layers"></div>
<div id="toast"></div>
<input type="file" id="camInput" accept="image/*" capture="environment" hidden>
<input type="file" id="galInput" accept="image/*" multiple hidden>
<script src="i18n.js"></script>
<script src="store.js"></script>
<script src="kullanim.js"></script>
<script src="sync.js"></script>
<script src="icons.js"></script>
<script src="updater.js"></script>
<script src="app.js"></script>
<script src="ekler.js"></script>
<script>Kullanim.baslat({uygulama:"organizer",bulut:true,ai:false,linkAc:function(u){openUrl(u)},dil:function(){return I18N.lang},proje:function(){try{return Cloud.isConnected()?(Cloud.config()||{}).projectId:""}catch(e){return ""}}});</script>
</body>
</html>
